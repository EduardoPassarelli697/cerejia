<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEREJ.IA — Assistente Empresarial</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;
                    background:#1a1a2e;color:#e8e8f0;font-family:system-ui;flex-direction:column;gap:16px">
            <div style="width:56px;height:56px;background:#7c6ff7;border-radius:14px;
                        display:flex;align-items:center;justify-content:center;
                        font-size:28px;font-weight:bold;color:white">C</div>
            <div style="font-size:18px;font-weight:600">Carregando CEREJ.IA...</div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;
         background:#7f1d1d;color:white;padding:12px 20px;font-size:14px;z-index:9999">
        Ocorreu um erro.
        <a href="" style="color:#fca5a5">Recarregar</a>
    </div>

    <script>
        window.scrollParaBaixo = function(elementId) {
            const el = document.getElementById(elementId);
            if (el) el.scrollTop = el.scrollHeight;
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
